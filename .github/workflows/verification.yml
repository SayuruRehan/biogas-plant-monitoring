name: Verify assignment

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculations and corruption detection
        run: python -m unittest discover -s tests -v
      - name: Audit committed results and report
        run: python verify_submission.py
